<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portofolio Raflitya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0f1e;
      --bg-secondary: #0d1626;
      --bg-card: #111827;
      --bg-card-hover: #1a2437;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-orange: #f59e0b;
      --accent-green: #10b981;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #1e2d42;
      --border-hover: #3b82f6;
      --radius: 16px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      background: rgba(10, 15, 30, 0.90);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
    }
    .navbar-links {
      display: flex;
      gap: 16px;
      list-style: none;
      align-items: center;
    }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .nav-btn:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }
    .nav-btn.active {
      color: #ffffff;
      background: rgba(59,130,246,0.15);
      border-color: rgba(59,130,246,0.35);
    }
    .navbar-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .2s, transform .2s;
    }
    .navbar-cta:hover { opacity: .9; transform: translateY(-1px); }

    /* HERO */
    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px;
      position: relative;
      text-align: center;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(59,130,246,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 60%);
    }
    .hero-content { position: relative; z-index: 1; max-width: 840px; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--accent-blue);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .hero-badge-dot {
      width: 7px; height: 7px;
      background: var(--accent-blue);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(0.85); }
    }
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(36px, 6vw, 68px);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 18px;
      letter-spacing: -1px;
    }
    .hero-title .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-desc {
      font-size: 17px;
      color: var(--text-secondary);
      max-width: 640px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }
    .hero-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 0 25px rgba(59,130,246,0.35);
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
      border: none;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(59,130,246,0.5);
    }
    .btn-secondary-page {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      transition: all .2s;
      cursor: pointer;
    }
    .btn-secondary-page:hover {
      background: rgba(16, 185, 129, 0.22);
      transform: translateY(-2px);
    }
    .btn-github-outline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid var(--border);
      transition: all .2s;
    }
    .btn-github-outline:hover {
      border-color: var(--accent-blue);
      background: rgba(59,130,246,0.1);
    }

    /* BADGE SKILLS SECTION */
    .skills-section {
      background: var(--bg-secondary);
      padding: 60px 24px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .skills-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .section-tag {
      display: inline-block;
      background: rgba(59,130,246,0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(59,130,246,0.25);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(26px, 3.5vw, 38px);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .section-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 540px;
      margin: 0 auto 32px;
    }
    .skills-list {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .skill-card-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 22px;
      transition: transform .2s, border-color .2s;
    }
    .skill-card-badge:hover {
      transform: translateY(-3px);
      border-color: var(--accent-blue);
    }
    .skill-badge-icon {
      font-size: 26px;
    }
    .skill-badge-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: left;
    }

    /* BADGE LEVEL DENGAN WARNA DINAMIS */
    .badge-level {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .badge-mahir {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .badge-menengah {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .badge-pemula {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    /* PROJECTS SECTION */
    .projects-section {
      padding: 80px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    /* PROJECT CARD */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      opacity: 0;
      transition: opacity .3s;
    }
    .project-card:hover {
      transform: translateY(-5px);
      border-color: rgba(59,130,246,0.4);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .project-card:hover::before { opacity: 1; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-number {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.25);
    }
    .card-dots {
      display: flex;
      gap: 5px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .dot-r { background: #ef4444; }
    .dot-y { background: #f59e0b; }
    .dot-g { background: #10b981; }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 22px;
    }
    .tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag::before { content: '#'; opacity: .6; }

    .btn-github {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
      width: 100%;
    }
    .btn-github:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    /* PENGALAMAN MAGANG PAGE STYLES */
    .internship-page {
      padding: 120px 24px 80px;
      max-width: 1000px;
      margin: 0 auto;
      min-height: 80vh;
    }
    .internship-hero-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      padding: 36px;
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }
    .internship-hero-card::after {
      content: '🌿';
      position: absolute;
      right: 20px;
      bottom: -10px;
      font-size: 120px;
      opacity: 0.12;
      pointer-events: none;
    }
    .internship-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .internship-instansi {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .internship-role {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .internship-summary {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 760px;
    }

    .internship-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 36px;
    }
    .internship-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: border-color .2s;
    }
    .internship-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
    }
    .internship-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .internship-duties-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .internship-duties-list li {
      position: relative;
      padding-left: 24px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }
    .internship-duties-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #34d399;
      font-weight: bold;
    }

    .internship-skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .internship-skill-pill {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    /* FOOTER */
    .footer {
      border-top: 1px solid var(--border);
      padding: 30px 24px;
      text-align: center;
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-size: 13px;
    }
    .footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .navbar { padding: 14px 20px; }
      .navbar-links { gap: 8px; }
      .nav-btn { padding: 6px 10px; font-size: 12px; }
      .hero { padding: 100px 20px 40px; }
      .projects-grid { grid-template-columns: 1fr; }
      .internship-hero-card { padding: 24px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GITHUB_PROFILE = "https://github.com/raflitya";

    /* Icon GitHub */
    const GitHubIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
    );

    /* Komponen BadgeSkill (Tugas 1: In-Lab Task) */
    function BadgeSkill({ namaSkill, level, icon }) {
      const getLevelClass = (lvl) => {
        if (lvl === 'Mahir') return 'badge-mahir';
        if (lvl === 'Menengah') return 'badge-menengah';
        return 'badge-pemula';
      };

      return (
        <div className="skill-card-badge">
          <div className="skill-badge-icon">{icon}</div>
          <div>
            <div className="skill-badge-name">{namaSkill}</div>
            <div className={`badge-level ${getLevelClass(level)}`}>
              ● {level}
            </div>
          </div>
        </div>
      );
    }

    /* Komponen Kartu Proyek (Tugas 3: Minimal 4 Kartu) */
    function ProjectCard({ project, index }) {
      return (
        <div className="project-card">
          <div>
            <div className="card-top">
              <span className="card-number">PROYEK #{index + 1}</span>
              <div className="card-dots">
                <span className="dot dot-r"></span>
                <span className="dot dot-y"></span>
                <span className="dot dot-g"></span>
              </div>
            </div>

            {/* Judul Proyek */}
            <h3 className="card-title">{project.title}</h3>

            {/* Ringkasan Deskripsi */}
            <p className="card-desc">{project.description}</p>

            {/* Tagar Teknologi */}
            <div className="card-tags">
              {project.tags.map(tag => (
                <span key={tag} className="tag">{tag}</span>
              ))}
            </div>
          </div>

          {/* Tombol Tautan Repositori GitHub */}
          <a
            href={project.github}
            target="_blank"
            rel="noopener noreferrer"
            className="btn-github"
          >
            <GitHubIcon /> Tautan Repositori GitHub
          </a>
        </div>
      );
    }

    /* Halaman Pengalaman Magang */
    function InternshipPage({ onBackToPortfolio }) {
      const internshipData = {
        instansi: "Dinas Lingkungan Hidup",
        bidang: "Administrasi",
        posisi: "Staff Administrasi (Internship)",
        periode: "Pengalaman Kerja Lapangan / Magang",
        deskripsi: "Pernah melaksanakan magang di Dinas Lingkungan Hidup dengan penempatan pada bidang administrasi perkantoran. Berperan aktif dalam tata kelola dokumen persuratan, input rekapitulasi data lingkungan hidup, verifikasi berkas pelayanan, serta pengarsipan digital.",
        tanggungJawab: [
          "Pengelolaan dan pencatatan alur surat masuk dan surat keluar resmi dinas secara sistematis.",
          "Digitalisasi arsip dokumen perizinan lingkungan, berkas persampahan, dan pelaporan instansi.",
          "Rekapitulasi data kegiatan operasional lingkungan hidup ke dalam format spreadsheet terstruktur.",
          "Membantu administrasi pelayanan publik dan koordinasi berkas dengan seksi/bidang terkait.",
          "Pembuatan notulensi rapat dinas serta penyusunan draf berkas laporan kegiatan mingguan."
        ],
        keahlian: [
          "Administrasi Perkantoran",
          "Manajemen Arsip & Persuratan",
          "Pengolahan Data (Excel / Spreadsheet)",
          "Komunikasi & Koordinasi Antar Bidang",
          "Ketelitian & Akurasi Data",
          "Pelayanan Publik Prima"
        ]
      };

      return (
        <div className="internship-page">
          <div className="internship-hero-card">
            <span className="internship-tag">🌱 Pengalaman Magang</span>
            <h1 className="internship-instansi">{internshipData.instansi}</h1>
            <div className="internship-role">Bidang: {internshipData.bidang} • {internshipData.posisi}</div>
            <p className="internship-summary">{internshipData.deskripsi}</p>
          </div>

          <div className="internship-grid">
            <div className="internship-card">
              <h3 className="internship-card-title">
